# Isolated local test stack. This file does not alter the hosted Supabase project.
project_id = "christmas-planner-renovacion-4973"
[api]
enabled = true
port = 56491
schemas = ["public", "graphql_public", "christmas_planner"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56492
shadow_port = 56490
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = false
[inbucket]
enabled = true
port = 56494
[analytics]
enabled = false
[edge_runtime]
enabled = false
[realtime]
enabled = false
[storage]
enabled = true
file_size_limit = "2MiB"
[auth]
enabled = true
site_url = "http://localhost:9000"
